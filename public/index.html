<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ＣＲＡＳＨＥＲ ＭＤ - Pair</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:monospace;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{border:1px solid #fff;border-radius:20px;padding:30px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 20px rgba(255,255,255,0.2)}
h1{font-size:22px;letter-spacing:3px;margin-bottom:10px}
h3{font-size:14px;color:#aaa;margin-bottom:20px}
.box{margin-top:20px}
input{padding:14px;width:100%;border-radius:10px;border:none;outline:none;background:#111;color:#fff;border:1px solid #333;text-align:center;font-size:16px}
button{padding:14px;width:100%;margin-top:15px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;transition:0.3s}
button:hover{background:#ccc}
#code{font-size:26px;margin-top:20px;letter-spacing:6px;color:#0f0;font-weight:bold;min-height:40px}
#status{margin-top:10px;color:#888;font-size:13px}
.footer{margin-top:25px;font-size:12px;color:#666}
.power{color:#fff;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>◈┈▉ ＣＲＡＳＨＥＲ ＭＤ ▉┄◈</h1>
<h3>PAIRING SITE - GET CODE</h3>
<p>⚡ Power • Speed • Control</p>
<div class="box">
<input id="num" type="text" placeholder="2348071569915" />
<button onclick="getCode()">GET PAIR CODE</button>
<div id="code"></div>
<div id="status"></div>
</div>
<div class="footer">
<p><span class="power">CRASHER MD — 2026</span><br>Enter number without + and get 8-digit code</p>
</div>
</div>
<script>
async function getCode(){
  const num = document.getElementById('num').value.trim();
  const codeEl = document.getElementById('code');
  const statusEl = document.getElementById('status');
  if(!num){ statusEl.innerText = "Enter number"; return; }
  codeEl.innerText = "...";
  statusEl.innerText = "Generating code... wait";
  try {
    const res = await fetch('/pair?number='+encodeURIComponent(num));
    const data = await res.json();
    if(data.code){
      codeEl.innerText = data.code;
      statusEl.innerText = "✅ Copy code & paste in WhatsApp > Linked Devices > Link with phone number";
    } else {
      codeEl.innerText = "";
      statusEl.innerText = "❌ "+(data.error||"Failed");
    }
  } catch(e){
    statusEl.innerText = "❌ Error: "+e.message;
  }
}
</script>
</body>
</html>
